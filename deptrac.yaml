deptrac:
    cache_file: tools/.cache/deptrac.cache

    paths:
        - ./src

    layers:
        - name: App/Domain
          collectors:
              - { type: classLike, value: ^App\\Domain\\ }

        - name: App/Application
          collectors:
              - { type: classLike, value: ^App\\Application\\ }

        - name: App/Infrastructure
          collectors:
              - { type: classLike, value: ^App\\Infrastructure\\ }

        - name: Vendor/Doctrine/ORM/Mapping
          collectors:
              - { type: classLike, value: ^Doctrine\\ORM\\Mapping }

        - name: Vendor/Doctrine/DBAL/Types
          collectors:
              - { type: classLike, value: ^Doctrine\\DBAL\\Types }

        - name: Vendor/Symfony/Validator/Constraints
          collectors:
              - { type: classLike, value: ^Symfony\\Component\\Validator\\Constraints }

        - name: Vendor/Symfony/Clock/DatePoint
          collectors:
              - { type: classLike, value: ^Symfony\\Component\\Clock\\DatePoint }

        - name: Vendor/Symfony/Translation/TranslatableMessage
          collectors:
              - { type: classLike, value: ^Symfony\\Component\\Translation\\TranslatableMessage }

        - name: Vendor/Symfony/Uid/Uuid
          collectors:
              - { type: classLike, value: ^Symfony\\Component\\Uid\\Uuid }

        - name: Vendor/Webmozart/Assert/Assert
          collectors:
              - { type: classLike, value: ^Webmozart\\Assert\\Assert }

        - name: Vendor
          collectors:
              - type: bool
                must:
                    - { type: classLike, value: ^(?!App\\) }
                must_not:
                    - { type: classLike, value: '^[a-zA-Z]+$' } # native PHP classes
                    - { type: layer, value: Vendor/Doctrine/ORM/Mapping }
                    - { type: layer, value: Vendor/Doctrine/DBAL/Types }
                    - { type: layer, value: Vendor/Symfony/Validator/Constraints }
                    - { type: layer, value: Vendor/Symfony/Clock/DatePoint }
                    - { type: layer, value: Vendor/Symfony/Translation/TranslatableMessage }
                    - { type: layer, value: Vendor/Symfony/Uid/Uuid }
                    - { type: layer, value: Vendor/Webmozart/Assert/Assert }

    ruleset:
        App/Domain:
            - Vendor/Doctrine/ORM/Mapping
            - Vendor/Doctrine/DBAL/Types
            - Vendor/Symfony/Validator/Constraints
            - Vendor/Symfony/Clock/DatePoint
            - Vendor/Symfony/Translation/TranslatableMessage
            - Vendor/Symfony/Uid/Uuid
            - Vendor/Webmozart/Assert/Assert
        App/Application:
            - App/Domain
            - Vendor
        App/Infrastructure:
            - App/Domain
            - App/Application
            - Vendor
            - Vendor/Doctrine/DBAL/Types

    skip_violations:
        App\Domain\Data\Model\User:
            - Symfony\Component\Security\Core\User\UserInterface
            - Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface

        App\Domain\Data\ValueObject\PlainPassword:
            - Symfony\Component\PasswordHasher\PasswordHasherInterface
